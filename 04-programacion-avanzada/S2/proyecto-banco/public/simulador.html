<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Crédito Personal</title>
    <link rel="stylesheet" href="banco.css">
</head>
<body>
    <div class="container">
        <h2>Solicitud de Crédito Personal</h2>
        <form id="formCredito" action="/evaluar-credito" method="POST">
            <div class="grupo">
                <label for="nombre">Nombre del Solicitante:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="grupo">
                <label for="ingreso">Ingreso Mensual (Q):</label>
                <input type="number" id="ingreso" name="ingreso" required>
            </div>

            <div class="grupo">
                <label for="monto">Monto Solicitado (Q):</label>
                <input type="number" id="monto" name="monto" required>
            </div>

            <button type="submit">Enviar Solicitud</button>
        </form>
    </div>

    <script>
        const formulario = document.getElementById('formCredito');

        formulario.addEventListener('submit', function(event) {
            const ingreso = parseFloat(document.getElementById('ingreso').value);
            const monto = parseFloat(document.getElementById('monto').value);

            // Validación del Cliente: el monto no debe ser mayor a 10 veces el ingreso
            if (monto > (ingreso * 10)) {
                // Detiene el envío del formulario
                event.preventDefault(); 
                // Alerta básica solicitada
                alert('El monto excede su capacidad de endeudamiento.');
            }
        });
    </script>
</body>
</html>
