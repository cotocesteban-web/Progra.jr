<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subastas Órbita Alfa</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

    <form action="/subasta" method="POST" class="card">
        
        <div class="columna">
            <label for="idLote">ID del Lote:</label>
            <input type="number" id="idLote" name="idLote" required>
        </div>

        <div class="columna">
            <label for="comerciante">Comerciante:</label>
            <input type="text" id="comerciante" name="comerciante" required>
        </div>

        <div class="form-group">
            <label for="oferta">Oferta (Créditos):</label>
            <input type="number" id="oferta" name="oferta" required>
        </div>

        <button type="submit">Enviar Oferta</button>

    </form>

</body>
</html>
